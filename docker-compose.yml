services:
  postgres:
    image: postgres:17-alpine
    container_name: sourcebase-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgweb:
    image: sosedoff/pgweb:latest
    container_name: sourcebase-pgweb
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    ports:
      - "3002:8081"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  sourcebase-api:
    image: ghcr.io/stevelee2497/sourcebase-api:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sourcebase-api
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - AppSettings__AdminEmail=${ADMIN_EMAIL}
      - AppSettings__AdminPassword=${ADMIN_PASSWORD}
      - AppSettings__WebUrl=${WEB_URL}
      - AppSettings__SendGridApiKey=${SENDGRID_API_KEY}
      - AppSettings__SendGridAccountOwner=${SENDGRID_ACCOUNT_OWNER}
      - AllowedSpecificOrigins__0=${WEB_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  sourcebase-web:
    image: ghcr.io/stevelee2497/sourcebase-web:latest
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: sourcebase-web
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ApiBaseUrl=http://sourcebase-api:8080
    depends_on:
      - sourcebase-api
    networks:
      - internal

  nginx:
    image: nginx:alpine
    container_name: sourcebase-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - sourcebase-web
    networks:
      - internal

volumes:
  postgres_data:

networks:
  internal:
