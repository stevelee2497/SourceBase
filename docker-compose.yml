services:
  postgres:
    image: postgres:17-alpine
    container_name: sourcebase-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-backup:
    build:
      context: ./backup
    container_name: sourcebase-postgres-backup
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - CF_ACCOUNT_ID=${CF_ACCOUNT_ID}
      - CF_ACCESS_KEY_ID=${CF_ACCESS_KEY_ID}
      - CF_SECRET_ACCESS_KEY=${CF_SECRET_ACCESS_KEY}
      - R2_BUCKET=backup
      - R2_PREFIX=sourcebase-postgres
      - BACKUP_SCHEDULE=${BACKUP_SCHEDULE:-0 3 * * *}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  pgweb:
    image: sosedoff/pgweb:latest
    container_name: sourcebase-pgweb
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    ports:
      - "3002:8081"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: sourcebase-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  sourcebase-api:
    image: ghcr.io/stevelee2497/sourcebase-api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sourcebase-api-${IMAGE_TAG:-latest}
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - AdminEmail=${ADMIN_EMAIL}
      - AdminPassword=${ADMIN_PASSWORD}
      - ConnectionStrings__RedisConnection=redis:6379,password=${REDIS_PASSWORD}
      - AllowedSpecificOrigins__1=https://${WEB_URL}
      - AllowedSpecificOrigins__2=https://*.${CF_URL}
      - SendGridApiKey=${SENDGRID_API_KEY}
      - SendGridAccountOwner=${SENDGRID_ACCOUNT_OWNER}
      - BetterStackSourceToken=${BETTERSTACK_SOURCE_TOKEN}
      - R2__AccessKeyId=${CF_ACCESS_KEY_ID}
      - R2__SecretAccessKey=${CF_SECRET_ACCESS_KEY}
      - R2__PublicUrl=${CF_PUBLIC_URL}
      - R2__ServiceURL=https://${CF_ACCOUNT_ID}.r2.cloudflarestorage.com
    volumes:
      - ./logs/api:/app/Logs
    ports:
      - "3000:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  dozzle:
    image: amir20/dozzle:latest
    container_name: sourcebase-dozzle
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "3003:8080"
    networks:
      - internal

  caddy:
    image: caddy:alpine
    container_name: sourcebase-caddy
    restart: unless-stopped
    environment:
      - API_URL=${API_URL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - sourcebase-api
    networks:
      - internal

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  internal:
