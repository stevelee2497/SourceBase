name: Build & Push Docker Images

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Run tests
        env:
          USE_POSTGRES: 'true'
          USE_REDIS: 'true'
        run: dotnet test SourceBase.Tests --verbosity normal

  version:
    name: Calculate Version
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    outputs:
      new_version: ${{ steps.calc.outputs.new_version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Calculate next version
        id: calc
        run: |
          latest=$(git tag -l 'v1.*' | sort -V | tail -1)
          if [ -z "$latest" ]; then
            new_version="v1.0"
          else
            x=$(echo "$latest" | sed 's/v1\.//')
            new_version="v1.$((x + 1))"
          fi
          echo "new_version=$new_version" >> $GITHUB_OUTPUT
          echo "Next version: $new_version"

  build-and-push:
    name: Build & Push API
    runs-on: ubuntu-latest
    needs: [test, version]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata for API image
        id: meta-api
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/sourcebase-api
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.version.outputs.new_version }}
            type=sha,prefix=,format=short

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push-web:
    name: Build & Push Web
    runs-on: ubuntu-latest
    needs: [test, version]
    environment: Production
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata for Web image
        id: meta-web
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/sourcebase-web
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.version.outputs.new_version }}
            type=sha,prefix=,format=short

      - name: Build and push Web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          build-args: |
            API_URL=${{ vars.API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  tag-release:
    name: Tag Release
    runs-on: ubuntu-latest
    needs: [build-and-push, build-and-push-web, version]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Push git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ needs.version.outputs.new_version }}
          git push origin ${{ needs.version.outputs.new_version }}

  deploy-api:
    name: Deploy API to VPS
    runs-on: ubuntu-latest
    needs: [tag-release, version]
    environment: Production

    steps:
      - name: Pull and restart containers via SSH
        uses: appleboy/ssh-action@v1
        env:
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDGRID_ACCOUNT_OWNER: ${{ secrets.SENDGRID_ACCOUNT_OWNER }}
          WEB_URL: ${{ vars.WEB_URL }}
          API_URL: ${{ vars.API_URL }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          BETTERSTACK_SOURCE_TOKEN: ${{ secrets.BETTERSTACK_SOURCE_TOKEN }}
          CF_URL: ${{ vars.CF_URL }}
          IMAGE_TAG: ${{ needs.version.outputs.new_version }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,ADMIN_EMAIL,ADMIN_PASSWORD,SENDGRID_API_KEY,SENDGRID_ACCOUNT_OWNER,WEB_URL,API_URL,REDIS_PASSWORD,BETTERSTACK_SOURCE_TOKEN,CF_URL,IMAGE_TAG
          script: |
            set -e
            cd ${{ vars.VPS_APP_PATH || '~/SourceBase' }}
            git pull
            IMAGE_TAG=$IMAGE_TAG docker compose pull sourcebase-api sourcebase-web
            output=$(IMAGE_TAG=$IMAGE_TAG docker compose up -d --remove-orphans 2>&1)
            echo "$output"
            if echo "$output" | grep -q 'variable is not set. Defaulting to a blank string'; then
              echo "ERROR: One or more required environment variables are not set."
              exit 1
            fi

  deploy-web:
    name: Deploy Web to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: test
    environment: Production
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install WASM workload
        run: dotnet workload install wasm-tools

      - name: Inject production API URL
        run: |
          echo '{"ApiBaseUrl":"${{ vars.API_URL }}"}' > SourceBase.Web/wwwroot/appsettings.Production.json

      - name: Publish WASM
        run: dotnet publish SourceBase.Web/SourceBase.Web.csproj -c Release -o ./web-publish

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          projectName: ${{ vars.CF_PROJECT_NAME }}
          directory: ./web-publish/wwwroot
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
