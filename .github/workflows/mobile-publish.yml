name: Mobile Publish

on:
  push:
    branches: [main]
    paths:
      - 'SourceBase.Mobile/**'
      - '.github/workflows/mobile-publish.yml'
  workflow_dispatch:

jobs:
  version:
    name: Calculate Version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      new_version: ${{ steps.calc.outputs.new_version }}
      version_number: ${{ steps.calc.outputs.version_number }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Calculate next version
        id: calc
        run: |
          latest=$(git tag -l 'mobile-v1.*' | sort -V | tail -1)
          if [ -z "$latest" ]; then
            version_number="1.0"
          else
            x=$(echo "$latest" | sed 's/mobile-v1\.//')
            version_number="1.$((x + 1))"
          fi
          new_version="mobile-v${version_number}"
          echo "new_version=$new_version" >> $GITHUB_OUTPUT
          echo "version_number=$version_number" >> $GITHUB_OUTPUT
          echo "Next mobile version: $new_version"

  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: version
    defaults:
      run:
        working-directory: SourceBase.Mobile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      # Generate the native android/ project from the Expo config.
      # versionName is set from the calculated version; versionCode from the run number.
      - name: Prebuild (generate android project)
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_PUBLIC_API_BASE_URL: https://api.quoctran.qzz.io

      - name: Set version name and code
        run: |
          GRADLE=android/app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"${{ needs.version.outputs.version_number }}\"/" $GRADLE
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" $GRADLE
          grep -E "versionName|versionCode" $GRADLE

      # The generated release buildType signs with the debug config by default, which is
      # fine for internal distribution. We re-sign the built APK below with a dedicated
      # keystore so the artifact is stable and installable on devices.
      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/jupiter.keystore" \
            -storepass jupiter -keypass jupiter \
            -alias jupiter -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Jupiter, OU=SourceBase, O=quoctran, C=US"

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: SourceBase.Mobile/android

      - name: Sign and align APK
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          IN=android/app/build/outputs/apk/release/app-release.apk
          [ -f "$IN" ] || IN=android/app/build/outputs/apk/release/app-release-unsigned.apk
          mkdir -p Artifacts
          OUT="Artifacts/Jupiter-v${{ needs.version.outputs.version_number }}.apk"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$IN" aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/jupiter.keystore" \
            --ks-key-alias jupiter \
            --ks-pass pass:jupiter \
            --key-pass pass:jupiter \
            --out "$OUT" aligned.apk
          "$BUILD_TOOLS/apksigner" verify "$OUT"
          echo "Signed APK: $OUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SourceBase.Mobile
          path: SourceBase.Mobile/Artifacts/Jupiter-v${{ needs.version.outputs.version_number }}.apk
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [version, build]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: SourceBase.Mobile
          path: ./dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ needs.version.outputs.new_version }} \
            --title "Mobile ${{ needs.version.outputs.new_version }}" \
            --notes "Android APK release ${{ needs.version.outputs.new_version }}" \
            "./dist/Jupiter-v${{ needs.version.outputs.version_number }}.apk"
