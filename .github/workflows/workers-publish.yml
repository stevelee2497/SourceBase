name: Workers Publish

on:
  push:
    branches: [main]
    paths:
      - 'SourceBase.Workers/**'
      - '.github/workflows/workers-publish.yml'
  workflow_dispatch:

jobs:
  build-test-deploy:
    name: Build, Test & Deploy Workers API
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: read
    defaults:
      run:
        working-directory: SourceBase.Workers

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: SourceBase.Workers/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Wrangler config
        run: |
          if grep -q 'replace-me' wrangler.jsonc; then
            echo "wrangler.jsonc still contains placeholder database_id=replace-me."
            echo "Create the Cloudflare D1 database first, then update SourceBase.Workers/wrangler.jsonc."
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Apply remote D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply sourcebase-workers --remote --config wrangler.jsonc

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc
