services:
  sourcebase-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sourcebase-api
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Data Source=/data/app.db
      - AppSettings__AdminEmail=${ADMIN_EMAIL}
      - AppSettings__AdminPassword=${ADMIN_PASSWORD}
      - AppSettings__WebUrl=${WEB_URL}
      - AppSettings__SendGridApiKey=${SENDGRID_API_KEY}
      - AppSettings__SendGridAccountOwner=${SENDGRID_ACCOUNT_OWNER}
      - AllowedSpecificOrigins__0=${WEB_URL}
    volumes:
      - sqlite_data:/data
    networks:
      - internal

  sourcebase-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: sourcebase-web
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ApiBaseUrl=http://sourcebase-api:8080
    depends_on:
      - sourcebase-api
    networks:
      - internal

  nginx:
    image: nginx:alpine
    container_name: sourcebase-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - sourcebase-web
    networks:
      - internal

volumes:
  sqlite_data:

networks:
  internal:
