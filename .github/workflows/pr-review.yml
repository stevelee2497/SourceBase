name: PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write

jobs:
  copilot-review:
    name: Request Copilot Review
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Post PR summary comment
        if: github.event.action == 'opened'
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"

          STATS=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json additions,deletions,changedFiles \
            --jq '"**+\(.additions) / -\(.deletions)** across \(.changedFiles) file(s)"')

          FILES=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json files \
            --jq '.files[] | "- `\(.path)` (+\(.additions)/-\(.deletions))"' | head -30)

          DESCRIPTION="${{ github.event.pull_request.body }}"
          if [ -z "$DESCRIPTION" ]; then
            DESCRIPTION="_No description provided._"
          fi

          gh pr comment "$PR_NUMBER" --repo "$REPO" --body "## PR Summary

**Branch:** \`${{ github.head_ref }}\` → \`${{ github.base_ref }}\`
**Changes:** ${STATS}

### Description
${DESCRIPTION}

### Changed files
${FILES}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Request Copilot code review
        id: copilot-review
        continue-on-error: true
        run: |
          ERROR=$(gh api \
            --method POST \
            "/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/requested_reviewers" \
            -f "reviewers[]=github-copilot" 2>&1)
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo "error_output<<EOF" >> "$GITHUB_OUTPUT"
            echo "$ERROR" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            exit $EXIT_CODE
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on Copilot review failure
        if: steps.copilot-review.outcome == 'failure'
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --body "### Copilot review could not be requested

**Error:** \`${{ steps.copilot-review.outputs.error_output }}\`

**Common causes:**
- Copilot code review is not enabled — go to **Settings → Copilot → Code review** and enable it
- The \`GITHUB_TOKEN\` lacks \`pull-requests: write\` permission
- The \`github-copilot\` reviewer is not available for this repository or plan

Please enable Copilot code review in repository settings or add a reviewer manually."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
