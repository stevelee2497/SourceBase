name: API Publish

on:
  push:
    branches: [main]
    paths:
      - 'SourceBase.Api/**'
      - 'SourceBase.Application/**'
      - 'SourceBase.Infrastructure/**'
      - 'SourceBase.Domain/**'
      - 'SourceBase.Tests/**'
      - 'SourceBase.ReportGenerator/**'
      - 'backup/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - '.github/workflows/api-publish.yml'

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Run tests
        env:
          USE_POSTGRES: 'true'
          USE_REDIS: 'true'
        run: >
          dotnet test SourceBase.Tests --verbosity normal
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./SourceBase.Tests/TestResults

      - name: Generate HTML test report
        if: always()
        run: >
          dotnet run --project SourceBase.ReportGenerator --
          --trx SourceBase.Tests/TestResults/test-results.trx
          --test-assembly SourceBase.Tests/bin/Debug/net10.0/SourceBase.Tests.dll
          --output test-report.html

      - name: Upload test report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: test-report.html

  version:
    name: Calculate Version
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    outputs:
      new_version: ${{ steps.calc.outputs.new_version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Calculate next version
        id: calc
        run: |
          latest=$(git tag -l 'api-v1.*' | sort -V | tail -1)
          if [ -z "$latest" ]; then
            new_version="api-v1.0"
          else
            x=$(echo "$latest" | sed 's/api-v1\.//')
            new_version="api-v1.$((x + 1))"
          fi
          echo "new_version=$new_version" >> $GITHUB_OUTPUT
          echo "Next API version: $new_version"

  build-and-push:
    name: Build & Push API
    runs-on: ubuntu-latest
    needs: [test, version]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Download test report artifact
        uses: actions/download-artifact@v8
        with:
          name: test-report
          path: .

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata for API image
        id: meta-api
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/sourcebase-api
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.version.outputs.new_version }}
            type=sha,prefix=,format=short

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  tag-release:
    name: Tag Release
    runs-on: ubuntu-latest
    needs: [build-and-push, version]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Push git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ needs.version.outputs.new_version }}
          git push origin ${{ needs.version.outputs.new_version }}

  deploy-api:
    name: Deploy API to VPS
    runs-on: ubuntu-latest
    needs: [build-and-push, version]
    environment: Production

    steps:
      - name: Pull and restart containers via SSH
        uses: appleboy/ssh-action@v1
        env:
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDGRID_ACCOUNT_OWNER: ${{ secrets.SENDGRID_ACCOUNT_OWNER }}
          WEB_URL: ${{ vars.WEB_URL }}
          API_URL: ${{ vars.API_URL }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          BETTERSTACK_SOURCE_TOKEN: ${{ secrets.BETTERSTACK_SOURCE_TOKEN }}
          CF_URL: ${{ vars.CF_URL }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_ACCESS_KEY_ID: ${{ secrets.CF_ACCESS_KEY_ID }}
          CF_SECRET_ACCESS_KEY: ${{ secrets.CF_SECRET_ACCESS_KEY }}
          CF_PUBLIC_URL: ${{ vars.CF_PUBLIC_URL }}
          IMAGE_TAG: ${{ needs.version.outputs.new_version }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,ADMIN_EMAIL,ADMIN_PASSWORD,SENDGRID_API_KEY,SENDGRID_ACCOUNT_OWNER,WEB_URL,API_URL,REDIS_PASSWORD,BETTERSTACK_SOURCE_TOKEN,CF_URL,CF_ACCOUNT_ID,CF_ACCESS_KEY_ID,CF_SECRET_ACCESS_KEY,CF_PUBLIC_URL,IMAGE_TAG
          script: |
            set -e
            cd ${{ vars.VPS_APP_PATH || '~/SourceBase' }}
            git pull
            IMAGE_TAG=$IMAGE_TAG docker compose pull sourcebase-api
            docker compose build postgres-backup
            output=$(IMAGE_TAG=$IMAGE_TAG docker compose up -d --remove-orphans 2>&1)
            echo "$output"
            if echo "$output" | grep -q 'variable is not set. Defaulting to a blank string'; then
              echo "ERROR: One or more required environment variables are not set."
              exit 1
            fi
